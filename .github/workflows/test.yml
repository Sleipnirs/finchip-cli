name: CLI tests

on:
  pull_request:
    branches: [main, preview]
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            package-check: false
          - os: ubuntu-latest
            node: 24
            package-check: true
          - os: ubuntu-latest
            node: 26
            package-check: false
          - os: windows-latest
            node: 22
            package-check: false
          - os: windows-latest
            node: 24
            package-check: true
          - os: macos-latest
            node: 22
            package-check: false
          - os: macos-latest
            node: 24
            package-check: true
          - os: macos-15-intel
            node: 24
            package-check: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Verify published package
        if: matrix.package-check
        run: npm run check:package

  git-bash:
    name: Windows Git Bash
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Confirm the MSYS whoami is active
        shell: bash
        run: |
          test "$(command -v whoami)" = "/usr/bin/whoami"
      - name: Install and test under Git Bash
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm test

  node20-guard:
    name: Unsupported Node 20 guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Verify the published CLI fails clearly before loading application modules
        run: npm run check:node20-guard

  gates:
    name: Repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check shipped JavaScript syntax
        run: npm run check:syntax
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Verify published package
        run: npm run check:package
      - name: Check changed lines for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA..$HEAD_SHA"
          else
            git diff-tree --check --root -r "$HEAD_SHA"
          fi

  ci-required:
    name: ci-required
    if: always()
    needs: [test, git-bash, node20-guard, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if ${{ contains(needs.*.result, 'failure') }} || \
             ${{ contains(needs.*.result, 'cancelled') }} || \
             ${{ contains(needs.*.result, 'skipped') }}; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
